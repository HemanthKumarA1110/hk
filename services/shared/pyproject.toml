[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-shared"
version = "0.1.0"
description = "Shared library for Indian AI trading bot microservices"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "SQLAlchemy>=2.0.23",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.1",
    "httpx>=0.26.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.1",
    "cryptography>=41.0.7",
    "pyotp>=2.9.0",
    "smartapi-python>=1.5.5",
    "logzero>=1.7.0",
    "websocket-client>=1.7.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["trading_shared*"]
