x-common-env: &common-env
  ENV: ${ENV:-development}
  DATABASE_URL: postgresql://trader:traderpass@postgres:5432/trading
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:-super_secret_change_in_production}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-phase1_dev_encryption_key_32chars}
  CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost
  ALLOW_PUBLIC_REGISTRATION: ${ALLOW_PUBLIC_REGISTRATION:-true}
  EXPOSE_SERVICE_REGISTRY: ${EXPOSE_SERVICE_REGISTRY:-true}
  ENABLE_OPENAPI_DOCS: ${ENABLE_OPENAPI_DOCS:-true}
  RATE_LIMIT_LOGIN_PER_MINUTE: ${RATE_LIMIT_LOGIN_PER_MINUTE:-20}
  RATE_LIMIT_ORDERS_PER_MINUTE: ${RATE_LIMIT_ORDERS_PER_MINUTE:-30}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
  ANGEL_API_KEY: ${ANGEL_API_KEY:-}
  ANGEL_CLIENT_CODE: ${ANGEL_CLIENT_CODE:-}
  ANGEL_PASSWORD: ${ANGEL_PASSWORD:-}
  ANGEL_TOTP_SECRET: ${ANGEL_TOTP_SECRET:-}
  AUTH_SERVICE_URL: http://auth-service:8001
  MARKET_DATA_SERVICE_URL: http://market-data-service:8002
  STRATEGY_ENGINE_URL: http://strategy-engine:8003
  AI_DECISION_ENGINE_URL: http://ai-decision-engine:8004
  RISK_MANAGER_URL: http://risk-manager:8005
  ORDER_EXECUTION_URL: http://order-execution-engine:8006
  BACKTESTING_ENGINE_URL: http://backtesting-engine:8007
  PORTFOLIO_MANAGER_URL: http://portfolio-manager:8008
  ALERT_ENGINE_URL: http://alert-engine:8009
  ANALYTICS_ENGINE_URL: http://analytics-engine:8010
  TRADE_JOURNAL_URL: http://trade-journal-engine:8011
  ADMIN_DASHBOARD_URL: http://admin-dashboard:8012

services:
  postgres:
    image: postgres:15-alpine
    container_name: trading-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: traderpass
      POSTGRES_DB: trading
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    # Host port 5433 by default — avoids conflict with a local Postgres on :5432
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d trading"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: trading-redis
    restart: unless-stopped
    # No host port — services use redis://redis:6379 on the Docker network.
    # Avoids conflict with a local Redis on :6379. Use: docker compose exec redis redis-cli
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: trading-auth-service
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVICE_NAME: auth-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/live')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  market-data-service:
    build:
      context: .
      dockerfile: services/market-data-service/Dockerfile
    container_name: trading-market-data
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVICE_NAME: market-data-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health/live')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  strategy-engine:
    build:
      context: .
      dockerfile: services/strategy-engine/Dockerfile
    container_name: trading-strategy-engine
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVICE_NAME: strategy-engine
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      market-data-service:
        condition: service_started
    ports:
      - "8003:8003"

  ai-decision-engine:
    build:
      context: .
      dockerfile: services/ai-decision-engine/Dockerfile
    container_name: trading-ai-engine
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVICE_NAME: ai-decision-engine
      AI_DECISION_THRESHOLD: ${AI_DECISION_THRESHOLD:-75}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      strategy-engine:
        condition: service_started
    ports:
      - "8004:8004"

  risk-manager:
    build:
      context: .
      dockerfile: services/risk-manager/Dockerfile
    container_name: trading-risk-manager
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVICE_NAME: risk-manager
    depends_on:
      - postgres
      - redis
    ports:
      - "8005:8005"

  order-execution-engine:
    build:
      context: .
      dockerfile: services/order-execution-engine/Dockerfile
    container_name: trading-order-engine
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVICE_NAME: order-execution-engine
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      risk-manager:
        condition: service_started
    ports:
      - "8006:8006"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8006/health/live')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  backtesting-engine:
    build:
      context: .
      dockerfile: services/backtesting-engine/Dockerfile
    container_name: trading-backtesting
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVICE_NAME: backtesting-engine
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_started
    ports:
      - "8007:8007"

  portfolio-manager:
    build:
      context: .
      dockerfile: services/portfolio-manager/Dockerfile
    container_name: trading-portfolio
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVICE_NAME: portfolio-manager
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    ports:
      - "8008:8008"

  alert-engine:
    build:
      context: .
      dockerfile: services/alert-engine/Dockerfile
    container_name: trading-alert-engine
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVICE_NAME: alert-engine
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8009:8009"

  analytics-engine:
    build:
      context: .
      dockerfile: services/analytics-engine/Dockerfile
    container_name: trading-analytics
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVICE_NAME: analytics-engine
    depends_on:
      - postgres
    ports:
      - "8010:8010"

  trade-journal-engine:
    build:
      context: .
      dockerfile: services/trade-journal-engine/Dockerfile
    container_name: trading-journal
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVICE_NAME: trade-journal-engine
    depends_on:
      - postgres
    ports:
      - "8011:8011"

  admin-dashboard:
    build:
      context: .
      dockerfile: services/admin-dashboard/Dockerfile
    container_name: trading-admin-api
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVICE_NAME: admin-dashboard
    depends_on:
      - postgres
    ports:
      - "8012:8012"

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: trading-api-gateway
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVICE_NAME: api-gateway
    depends_on:
      - auth-service
      - market-data-service
      - risk-manager
      - admin-dashboard
      - order-execution-engine
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  celery-worker:
    build:
      context: .
      dockerfile: services/celery-worker/Dockerfile
    container_name: trading-celery-worker
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVICE_NAME: celery-worker
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  celery-beat:
    build:
      context: .
      dockerfile: services/celery-worker/Dockerfile
    container_name: trading-celery-beat
    restart: unless-stopped
    command: celery -A app.worker.celery_app beat --loglevel=info
    environment:
      <<: *common-env
      SERVICE_NAME: celery-beat
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: http://localhost:8000
    container_name: trading-frontend
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
