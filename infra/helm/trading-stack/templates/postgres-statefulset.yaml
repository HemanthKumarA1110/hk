apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "trading-stack.fullname" . }}-postgres
  labels:
    app: {{ include "trading-stack.name" . }}-postgres
spec:
  serviceName: {{ include "trading-stack.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "trading-stack.name" . }}-postgres
  template:
    metadata:
      labels:
        app: {{ include "trading-stack.name" . }}-postgres
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image }}"
          env:
            - name: POSTGRES_USER
              value: "{{ .Values.postgres.user }}"
            - name: POSTGRES_PASSWORD
              value: "{{ .Values.postgres.password }}"
            - name: POSTGRES_DB
              value: "{{ .Values.postgres.db }}"
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
