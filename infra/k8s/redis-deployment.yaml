apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-redis
  labels:
    app: trading-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trading-redis
  template:
    metadata:
      labels:
        app: trading-redis
    spec:
      containers:
        - name: redis
          image: redis:7
          ports:
            - containerPort: 6379
