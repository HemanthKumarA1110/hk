apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: trading-backend:latest
          command: ["celery", "-A", "app.tasks.worker.celery_app", "worker", "--loglevel=info"]
          env:
            - name: DATABASE_URL
              value: postgresql://trader:traderpass@postgres:5432/trading
            - name: REDIS_URL
              value: redis://redis:6379/0
